{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: phonebook
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webserver-svc
                port:
                  number: {{ .Values.webServer.service.port }}
          - path: /result
            pathType: Prefix
            backend:
              service:
                name: resultserver-svc
                port:
                  number: {{ .Values.resultServer.service.port }}
{{- end }}
