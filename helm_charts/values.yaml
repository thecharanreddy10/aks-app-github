# Default values for the phonebook AKS Upgrade POC.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

webServer:
  image:
    repository: devenes/python_web_server
    tag: "18.0"
    pullPolicy: IfNotPresent
  replicaCount: 2
  service:
    type: NodePort
    port: 80
    nodePort: 30001
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  probes:
    path: /
    initialDelaySeconds: 10
    periodSeconds: 10

resultServer:
  image:
    repository: devenes/python_result_server
    tag: "18.0"
    pullPolicy: IfNotPresent
  replicaCount: 2
  service:
    type: NodePort
    port: 80
    nodePort: 30002
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  probes:
    path: /
    initialDelaySeconds: 10
    periodSeconds: 10

mysql:
  image:
    repository: mysql
    tag: "5.7"
    pullPolicy: IfNotPresent
  replicaCount: 1
  user: devenes
  database: phonebook
  # POC-only defaults (match the app's previous hardcoded values). Override via --set/-f for real use.
  secret:
    rootPassword: "J12345j"
    adminPassword: "Devenes_1"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  storage:
    size: 5Gi
    accessMode: ReadWriteOnce

# Azure Disk CSI StorageClass backing the MySQL PVC.
storageClass:
  create: true
  name: mysql-managed-disk
  provisioner: disk.csi.azure.com
  skuName: StandardSSD_LRS
  reclaimPolicy: Retain
  allowVolumeExpansion: true
  # WaitForFirstConsumer (AKS default/best practice) ties the disk to the zone
  # of the node the pod is scheduled on. Set to "Immediate" to intentionally
  # provision the disk ahead of scheduling, which can reproduce a zone
  # mismatch (and pod stuck Pending) when a drained node is replaced in a
  # different zone.
  volumeBindingMode: WaitForFirstConsumer

# PodDisruptionBudgets used to deliberately reproduce the node-drain/eviction
# constraint. maxUnavailable: 0 blocks all voluntary evictions of the
# selected pods, so a node drain/upgrade will stall until relaxed.
pdb:
  webServer:
    enabled: true
    maxUnavailable: 0
  resultServer:
    enabled: false
    maxUnavailable: 0

ingress:
  enabled: false
  className: nginx

